<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robert 智能補給艙需求清單</title>
    <style>
        :root {
            --primary-color: #1A365D; /* 深藍色 */
            --accent-color: #D69E2E; /* 金色 */
            --bg-color: #F7FAFC;
            --text-color: #2D3748;
            --border-radius: 12px;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'LiHei Pro', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .header p {
            margin: 5px 0;
            font-size: 14px;
            color: #E2E8F0;
        }

        .blessing {
            margin-top: 15px;
            font-size: 13px;
            color: var(--accent-color);
        }

        form {
            padding: 30px;
        }

        .section-title {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label.question {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4A5568;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #CBD5E0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1);
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 10px 15px;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .option-label:hover {
            background-color: #EDF2F7;
        }

        input[type="radio"], input[type="checkbox"] {
            margin-right: 10px;
            accent-color: var(--primary-color);
            width: 18px;
            height: 18px;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #2c5282;
        }

        @media (max-width: 480px) {
            form {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Robert 智能補給艙需求清單</h1>
        <p>歡迎登機！在這個補給艙裡，沒有壓力。</p>
        <p>請隨心填寫您的需求，讓我為您規劃專屬的雲端補給方案。</p>
        <div class="blessing">願耶和華賜福給你，保護你。✝️</div>
    </div>

    <!-- 這裡已經改為 id="robertForm"，準備與下方的腳本串聯 -->
    <form id="robertForm">
        
        <!-- 第一部分 -->
        <div class="section-title">一、 基本航行資料</div>
        
        <div class="form-group">
            <label class="question" for="name">您的名字 / Line 名稱</label>
            <input type="text" id="name" name="name" placeholder="請輸入名稱" required>
        </div>

        <div class="form-group">
            <label class="question">您的身分</label>
            <div class="options-group">
                <label class="option-label"><input type="radio" name="relationship" value="家人"> 家人</label>
                <label class="option-label"><input type="radio" name="relationship" value="朋友"> 朋友</label>
                <label class="option-label"><input type="radio" name="relationship" value="同事"> 同事</label>
                <label class="option-label"><input type="radio" name="relationship" value="其他"> 其他</label>
            </div>
        </div>

        <!-- 第二部分 -->
        <div class="section-title">二、 生活燃料供給</div>

        <div class="form-group">
            <label class="question">日常飲食重心</label>
            <div class="options-group">
                <label class="option-label"><input type="radio" name="diet" value="外食族"> 餐餐外食，方便就好</label>
                <label class="option-label"><input type="radio" name="diet" value="喜歡下廚"> 喜歡下廚，追求儀式感</label>
                <label class="option-label"><input type="radio" name="diet" value="半自炊"> 忙碌中的半自炊（快速料理）</label>
            </div>
        </div>

        <div class="form-group">
            <label class="question">習慣採買通路 (可複選)</label>
            <div class="options-group">
                <label class="option-label"><input type="checkbox" name="shopping" value="大型量販"> 大型超市 / 量販店</label>
                <label class="option-label"><input type="checkbox" name="shopping" value="便利商店"> 便利商店</label>
                <label class="option-label"><input type="checkbox" name="shopping" value="電商平台"> 電商平台 (蝦皮/Momo/PChome)</label>
                <label class="option-label"><input type="checkbox" name="shopping" value="補給艙"> Robert 智能補給艙 (優先看這裡！)</label>
            </div>
        </div>

        <!-- 第三部分 -->
        <div class="section-title">三、 航行地圖</div>

        <div class="form-group">
            <label class="question">偏好的航行地區 (可複選)</label>
            <div class="options-group">
                <label class="option-label"><input type="checkbox" name="travel_region" value="國內"> 國內漫遊 (本島/外島)</label>
                <label class="option-label"><input type="checkbox" name="travel_region" value="亞洲"> 亞洲短程 (日韓泰等)</label>
                <label class="option-label"><input type="checkbox" name="travel_region" value="歐美"> 歐美長程</label>
            </div>
        </div>

        <div class="form-group">
            <label class="question">航行頻率</label>
            <div class="options-group">
                <label class="option-label"><input type="radio" name="travel_freq" value="領航常客"> 領航常客 (每月至少一次)</label>
                <label class="option-label"><input type="radio" name="travel_freq" value="定期補給"> 定期補給 (一年多次)</label>
                <label class="option-label"><input type="radio" name="travel_freq" value="年度行程"> 年度行程 (一年至少一次)</label>
                <label class="option-label"><input type="radio" name="travel_freq" value="隨心所欲"> 隨心所欲 (不定期，看心情出發)</label>
            </div>
        </div>

        <div class="form-group">
            <label class="question">習慣使用的航行預訂工具 (可複選)</label>
            <div class="options-group">
                <label class="option-label"><input type="checkbox" name="travel_tools" value="訂房平台"> 訂房平台 (Agoda / Booking)</label>
                <label class="option-label"><input type="checkbox" name="travel_tools" value="體驗活動"> 體驗活動 (Klook / KKday)</label>
                <label class="option-label"><input type="checkbox" name="travel_tools" value="懶人包"> 懶人包 (跟團 / 包車)</label>
            </div>
        </div>

        <!-- 第四部分 -->
        <div class="section-title">四、 深度補給願望</div>

        <div class="form-group">
            <label class="question">您最希望在補給艙看到哪些內容？ (可複選)</label>
            <div class="options-group">
                <label class="option-label"><input type="checkbox" name="wishlist" value="AI工具"> AI 工具與生產力教學</label>
                <label class="option-label"><input type="checkbox" name="wishlist" value="3C硬體"> 3C 硬體與收納開箱</label>
                <label class="option-label"><input type="checkbox" name="wishlist" value="深度旅遊"> 深度旅遊景點與攝影建議</label>
                <label class="option-label"><input type="checkbox" name="wishlist" value="隱藏好物"> 隱藏版好物團購</label>
            </div>
        </div>

        <div class="form-group">
            <label class="question" for="message">有什麼想對機長說的話嗎？</label>
            <textarea id="message" name="message" rows="4" placeholder="歡迎留下您的想法..."></textarea>
        </div>

        <button type="submit" class="submit-btn">確認發射 / 提交表單</button>
    </form>
</div>

<!-- 這裡是幫您串接好專屬網址的 JavaScript 魔法 -->
<script>
    document.getElementById('robertForm').addEventListener('submit', function(e) {
        e.preventDefault(); // 防止畫面跳轉
        
        const form = this;
        const btn = document.querySelector('.submit-btn');
        const originalBtnText = btn.textContent;
        
        // 變更按鈕狀態為發射中
        btn.textContent = '🚀 補給艙發射中...';
        btn.disabled = true;
        btn.style.backgroundColor = '#4A5568';

        const formData = new FormData(form);

        // 將資料發送到您的 Apps Script
        fetch('https://script.google.com/macros/s/AKfycbz0KYgW_e3hMgoyIkI1avK4X7l5TB0Phzac2WQAluR_k1clMVeKUpaby-7e0wiOy2DsHg/exec', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if(data.result === 'success') {
                alert('✨ 登機成功！Robert 已經收到您的補給需求。');
                form.reset(); // 清空表單
            } else {
                alert('⚠️ 發生錯誤，請稍後再試一次。');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('連線失敗，請檢查網路連線。');
        })
        .finally(() => {
            // 恢復按鈕狀態
            btn.textContent = originalBtnText;
            btn.disabled = false;
            btn.style.backgroundColor = '';
        });
    });
</script>

</body>
</html>
